# ============================================================
# FluxPay na Netlify — painel (Next.js) + API (Express)
# ============================================================

[build]
  command = "npm install --workspaces --include-workspace-root && npm run build --workspace=backend && npm run build --workspace=frontend"
  publish = "frontend/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include-workspace-root"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[functions]
  node_bundler = "esbuild"

# Scheduled Functions exigem plano Pro — desligado no Free.
# [functions."scheduled-jobs"]
#   schedule = "*/10 * * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard-api/*"
  to = "/.netlify/functions/api/dashboard-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin-api/*"
  to = "/.netlify/functions/api/admin-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true
