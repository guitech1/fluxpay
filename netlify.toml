# ============================================================
# FluxPay na Netlify — painel (Next.js) + API (Express)
# ============================================================

[build]
  # tsc no backend; package.json em dist com type:module (ESM).
  # A função netlify/functions/api.ts importa ../../backend/dist/index.js
  # de forma que o esbuild da Netlify embuta express e deps no bundle.
  command = "npm install --workspaces --include-workspace-root --include=dev && npm run build --workspace=backend && printf '%s\n' '{\"type\":\"module\"}' > backend/dist/package.json && npm run build --workspace=frontend"
  publish = "frontend/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include-workspace-root --include=dev"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"

# Garante que o dist compilado está visível para o rastreamento do esbuild.
# NÃO incluir node_modules inteiro (estoura o zip no plano Free).
[functions.api]
  included_files = ["backend/dist/**", "backend/package.json"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard-api/*"
  to = "/.netlify/functions/api/dashboard-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin-api/*"
  to = "/.netlify/functions/api/admin-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true
