# ============================================================
# FluxPay na Netlify — painel (Next.js) + API (Express)
# ============================================================

[build]
  # --include=dev: typescript/tsc vive em devDependencies do backend.
  # Se NODE_ENV=production estiver setado no painel, o npm pula
  # devDependencies e o build quebra com "tsc: not found".
  # Depois do tsc, grava package.json em dist para o Node tratar os .js
  # como ESM (sem isso: Cannot use import statement outside a module).
  command = "npm install --workspaces --include-workspace-root --include=dev && npm run build --workspace=backend && printf '%s\n' '{\"type\":\"module\"}' > backend/dist/package.json && npm run build --workspace=frontend"
  publish = "frontend/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include-workspace-root --include=dev"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"

# Inclui o backend compilado no pacote da função api.
# backend/package.json + dist/package.json garantem "type": "module".
[functions.api]
  included_files = ["backend/dist/**", "backend/package.json"]

# Scheduled Functions exigem plano Pro — desligado no Free.
# [functions."scheduled-jobs"]
#   schedule = "*/10 * * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard-api/*"
  to = "/.netlify/functions/api/dashboard-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin-api/*"
  to = "/.netlify/functions/api/admin-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true
