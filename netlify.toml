# ============================================================
# FluxPay na Netlify — painel (Next.js) + API (Express)
# ============================================================

[build]
  # 1) instala workspaces (tsc em devDependencies do backend)
  # 2) compila backend com tsc
  # 3) empacota backend/dist em UM arquivo CJS para a função Netlify
  #    (esbuild embute express/cors/etc. — sem isso: Cannot find package express)
  # 4) build do frontend Next.js
  command = "npm install --workspaces --include-workspace-root --include=dev && npm run build --workspace=backend && npx --yes esbuild@0.25.0 backend/dist/index.js --bundle --platform=node --target=node22 --format=cjs --outfile=netlify/functions/backend-app.cjs && npm run build --workspace=frontend"
  publish = "frontend/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include-workspace-root --include=dev"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"

# O app Express vai empacotado em netlify/functions/backend-app.cjs (gerado no build).
# Não precisa included_files de backend/dist nem node_modules (isso estourava o zip).

# Scheduled Functions exigem plano Pro — desligado no Free.
# [functions."scheduled-jobs"]
#   schedule = "*/10 * * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard-api/*"
  to = "/.netlify/functions/api/dashboard-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin-api/*"
  to = "/.netlify/functions/api/admin-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true
