name: CI

on:
  push:
    branches:
      - feature/multi-acquirer-fees
      - feature/ultima-atualizacao-completa
  pull_request:
    branches:
      - main
      - feature/multi-acquirer-fees
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --workspace=backend
      - run: npm run typecheck --workspace=backend
      - run: npm test --workspace=backend
      - run: npm run build --workspace=backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck --workspace=frontend
      - run: npm run lint --workspace=frontend
      - run: npm run build --workspace=frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

  postgres-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluxpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migrations to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -c 'SELECT version();'
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/ci_finance_schema.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261011160000_023_unique_charge_and_safe_pix_confirmation.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261011180000_024_transactional_refund_reservations.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261011190000_025_atomic_withdrawal_reservation.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261011200000_026_atomic_withdrawal_rejection.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261011210000_027_refund_idempotency_keys.sql
          # Reapply 023 to assert its named CHECK constraint is safely idempotent.
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261011160000_023_unique_charge_and_safe_pix_confirmation.sql
      - name: Run SQL regression tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/tests/023_pix_confirmation_concurrency.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/tests/023b_constraint_reapply.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/tests/024_refund_reservation.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/tests/025_withdrawal_reservation.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/tests/026_withdrawal_rejection.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/tests/027_refund_idempotency.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/tests/028_rls_grants.sql
      - name: Execute real concurrent-session regressions
        env:
          PGPASSWORD: postgres
        run: bash supabase/tests/ci_concurrency.sh
      - name: Check migration invariants
        run: |
          grep -q "FOR UPDATE" supabase/migrations/20261011180000_024_transactional_refund_reservations.sql
          grep -q "fluxpay_reserve_refund" supabase/migrations/20261011180000_024_transactional_refund_reservations.sql
          grep -q "balance_transactions_one_refund_per_refund" supabase/migrations/20261011180000_024_transactional_refund_reservations.sql
          grep -q "FOR UPDATE" supabase/migrations/20261011190000_025_atomic_withdrawal_reservation.sql
          grep -q "FOR UPDATE" supabase/migrations/20261011200000_026_atomic_withdrawal_rejection.sql
          grep -q "refunds_org_env_idempotency_key_unique" supabase/migrations/20261011210000_027_refund_idempotency_keys.sql
          grep -q "pg_get_constraintdef" supabase/migrations/20261011160000_023_unique_charge_and_safe_pix_confirmation.sql
          grep -q "balance_transactions_charge_requires_payment" supabase/migrations/20261011160000_023_unique_charge_and_safe_pix_confirmation.sql

      - name: Apply and verify Web Push migrations in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261013211148_create_push_subscriptions_and_notification_log.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261013211153_seed_profanuspay_acquirer_disabled.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261013211556_harden_push_subscription_table_grants.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261013221114_harden_trigger_function_search_path.sql
          psql -h localhost -U postgres -d fluxpay_test -v ON_ERROR_STOP=1 -f supabase/tests/029_push_migrations.sql
