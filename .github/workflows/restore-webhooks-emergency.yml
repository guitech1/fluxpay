name: restore-webhooks-emergency

on:
  push:
    branches:
      - feature/ultima-atualizacao-completa
    paths:
      - ".github/workflows/restore-webhooks-emergency.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ultima-atualizacao-completa
          fetch-depth: 0
      - name: Restore webhooks.ts from 4f9068b (last complete pre-corruption)
        run: |
          set -euo pipefail
          git show 4f9068b42b9f06f13a55c67b345c5f445127795a:backend/src/routes/webhooks.ts > backend/src/routes/webhooks.ts
          wc -c backend/src/routes/webhooks.ts
          grep -q 'export default router' backend/src/routes/webhooks.ts
          grep -q 'router.post("/provider"' backend/src/routes/webhooks.ts
          # keep webhook-provider-auth helper (already on branch) for tests; route uses previous secret selection until manual apply
          rm -f backend/src/routes/.webhooks.b64.* || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/webhooks.ts
          git rm -f backend/src/routes/.webhooks.b64.0 backend/src/routes/.webhooks.b64.1 backend/src/routes/.webhooks.b64.2 2>/dev/null || true
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix: emergency restore webhooks.ts from 4f9068b (complete file)"
          git push origin HEAD:feature/ultima-atualizacao-completa
